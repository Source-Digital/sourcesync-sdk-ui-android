name: Release and Publish

run-name: >-
  ${{
    github.event_name == 'push' && format('Release and Publish - {0}', github.ref_name) ||
    format('Release and Publish - {0}', inputs.tag_version)
  }}
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag version to build (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from tag for push events
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Use provided tag version for manual dispatch
            VERSION="${{ inputs.tag_version }}"
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

    #   - name: Create Release PR
    #     uses: peter-evans/create-pull-request@v5
    #     with:
    #       commit-message: "chore: release version ${{ steps.semver.outputs.new_version }}"
    #       title: "Release v${{ steps.semver.outputs.new_version }}"
    #       body: |
    #         # Release v${{ steps.semver.outputs.new_version }}
    #       branch: "release/v${{ steps.semver.outputs.new_version }}"
    #       base: cicd
    #       labels: release

  publish:
    needs: [get-version]
    name: Release build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.get-version.outputs.version) || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set version
        run: echo "VERSION=${{ needs.get-version.outputs.version }}" >> $GITHUB_ENV

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and Publish
        run: ./gradlew :sourcesync-sdk-ui:publishAndReleaseToMavenCentral --stacktrace -Pversion=$BUILD_VERSION
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          BUILD_VERSION: ${{ needs.get-version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: Release v${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

